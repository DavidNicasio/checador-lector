<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Checador</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --fondo: #F4F6F8; --tinta: #1B2733; --azul: #1F4E78;
    --ok: #2E7D32; --error: #C62828; --aviso: #EF6C00;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--fondo); color: var(--tinta); font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; cursor: default; }

  /* Todo se mide en cqw (1% del ancho de la pantalla), así se ve igual en cualquier resolución 16:9 o 16:10 */
  .pantalla { container-type: inline-size; width: 100vw; height: 100vh; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; }
  .top { background: var(--azul); color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 2cqw; padding: 1.3cqw 2.4cqw; font-size: 2cqw; }
  .pill { font-size: max(10px, 1.6cqw); padding: .4cqw 1.4cqw; border-radius: 99px; background: rgba(255, 255, 255, .2); white-space: nowrap; }
  .pill.sin-red { background: #fff; color: #B85400; font-weight: 600; }
  .reloj { text-align: center; padding-top: 1.2cqw; }
  .fecha { font-size: 1.9cqw; color: #4A5B6C; }
  .hora { font-size: 8.4cqw; font-weight: 300; line-height: 1.05; font-variant-numeric: tabular-nums; color: var(--azul); }
  .estado { padding: 1.2cqw 4cqw 1.4cqw; display: grid; min-height: 0; }
  .tarjeta { border-radius: 1cqw; display: grid; align-content: center; justify-items: center; text-align: center; gap: .4cqw; padding: .8cqw 3cqw; background: #fff; border: .2cqw solid #D8DFE7; color: var(--azul); }
  .t { font-size: 3.2cqw; font-weight: 600; margin: 0; line-height: 1.15; }
  .s { font-size: 2cqw; margin: 0; line-height: 1.25; color: #4A5B6C; }
  #lectura { min-height: 2.6cqw; }
  #lectura.ok { color: var(--ok); font-weight: 600; }
  #lectura.err { color: var(--error); font-weight: 600; }
  .huella { width: 6.4cqw; height: 6.4cqw; animation: latido 2.2s ease-in-out infinite; }
  @keyframes latido { 0%, 100% { opacity: .55; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.04); } }
  @media (prefers-reduced-motion: reduce) { .huella { animation: none; } }
  .pie { font-size: max(10px, 1.5cqw); color: #566678; padding: .9cqw 2.4cqw; display: flex; justify-content: space-between; gap: 2cqw; border-top: 1px solid #DDE3EA; }
  #lector.mal { color: #B85400; font-weight: 600; }
  #aviso { color: #B85400; font-weight: 600; text-align: right; }

  /* ---- Modo administrador (Ctrl+Shift+A) ---- */
  .oculto { display: none !important; }
  .admin { position: fixed; inset: 0; background: var(--fondo); z-index: 10; display: none; grid-template-rows: auto minmax(0, 1fr); user-select: text; }
  .admin.abierto { display: grid; }
  .admin-top { background: #12344F; color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 1.1cqw 2.4cqw; font-size: max(14px, 1.9cqw); }
  .admin-cuerpo { padding: 2cqw 4cqw; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 1.2cqw; min-height: 0; font-size: max(13px, 1.5cqw); }
  .admin-login { max-width: 46cqw; display: grid; gap: 1cqw; align-content: start; }
  .admin input { font: inherit; padding: .8cqw 1cqw; border: 1px solid #B8C4D0; border-radius: .5cqw; background: #fff; color: var(--tinta); }
  .btn { font: inherit; padding: .7cqw 1.6cqw; border-radius: .5cqw; border: 1px solid #B8C4D0; background: #fff; color: var(--tinta); cursor: pointer; }
  .btn.primario { background: var(--azul); border-color: var(--azul); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  #admMensaje { margin: 0; min-height: 1.6em; color: var(--error); font-weight: 600; }
  #admMensaje.info { color: #4A5B6C; font-weight: 400; }
  .admin-lista { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 1cqw; min-height: 0; }
  .admin-filas { overflow: auto; background: #fff; border: 1px solid #D8DFE7; border-radius: .6cqw; }
  .fila { display: grid; grid-template-columns: 8cqw 1fr auto; gap: 1.2cqw; align-items: center; padding: .8cqw 1.4cqw; border-bottom: 1px solid #EDF1F5; }
  .fila:last-child { border-bottom: 0; }
  .num { color: #566678; font-variant-numeric: tabular-nums; }
  .chip { display: inline-block; margin-left: .5cqw; padding: .15cqw .9cqw; border-radius: 99px; background: #E3EEF8; color: var(--azul); font-size: .9em; }
  .chip.falta { background: #FFF0E0; color: #B85400; }
</style>
</head>
<body>
  <div class="pantalla">
    <div class="top"><span>Checador · <b id="sucursal">Sin configurar</b></span><span class="pill" id="red">Conectando…</span></div>
    <div class="reloj"><div class="fecha" id="fecha"></div><div class="hora" id="hora"></div></div>
    <div class="estado">
      <div class="tarjeta">
        <svg class="huella" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 20a16 16 0 0 1 32 0"/><path d="M13 36c-1-4-1-8 0-12a11 11 0 0 1 22 0c0 5 .5 9 2 13"/><path d="M19 40c-1-5-1-10 0-15a5 5 0 0 1 10 0c0 6 1 10 2.5 14"/><path d="M24 42c-1-6-1-12 0-17"/></svg>
        <p class="t" id="titulo">Coloca tu dedo en el lector</p>
        <p class="s">Mantén el dedo puesto hasta que el lector parpadee</p>
        <p class="s" id="lectura"></p>
      </div>
    </div>
    <div class="pie"><span id="info">Lector sin conexión con la API</span><span id="lector">Lector de huellas: iniciando…</span><span id="aviso"></span></div>

    <!-- Modo administrador: se abre con Ctrl+Shift+A -->
    <div class="admin" id="admin">
      <div class="admin-top"><b>Modo administrador</b><button class="btn" id="admSalir" type="button">Salir</button></div>
      <div class="admin-cuerpo">
        <div class="admin-login" id="admLogin">
          <span>Escribe la llave de administración para registrar huellas.</span>
          <input type="password" id="admLlave" autocomplete="off" spellcheck="false" placeholder="Llave de administración">
          <div><button class="btn primario" id="admEntrar" type="button">Entrar</button></div>
          <p id="admMensaje"></p>
        </div>
        <div class="admin-lista oculto" id="admLista">
          <input type="text" id="admBuscar" autocomplete="off" spellcheck="false" placeholder="Buscar por nombre o número de empleado">
          <div class="admin-filas" id="admFilas"></div>
        </div>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, '0');
  const enviar = (obj) => { if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(obj); };

  function tick() {
    const d = new Date();
    $('hora').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    const f = d.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
    $('fecha').textContent = f.charAt(0).toUpperCase() + f.slice(1);
  }
  tick();
  setInterval(tick, 250);

  // ---------- Modo administrador ----------
  const NOMBRES_DEDO = ['Pulgar der.', 'Índice der.', 'Medio der.', 'Anular der.', 'Meñique der.',
                        'Pulgar izq.', 'Índice izq.', 'Medio izq.', 'Anular izq.', 'Meñique izq.'];
  let empleados = [];

  const sinAcentos = (t) => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const adminAbierto = () => $('admin').classList.contains('abierto');

  function mensajeAdmin(texto, info) {
    $('admMensaje').textContent = texto || '';
    $('admMensaje').classList.toggle('info', !!info);
  }

  function abrirAdmin() {
    empleados = [];
    $('admFilas').textContent = '';
    $('admBuscar').value = '';
    $('admLlave').value = '';
    mensajeAdmin('');
    $('admLogin').classList.remove('oculto');
    $('admLista').classList.add('oculto');
    $('admEntrar').disabled = false;
    $('admin').classList.add('abierto');
    $('admLlave').focus();
  }

  function cerrarAdmin() {
    $('admin').classList.remove('abierto');
    $('admLlave').value = '';
    $('admFilas').textContent = '';
    empleados = [];
    enviar({ accion: 'salirAdmin' });
  }

  function entrarAdmin() {
    const llave = $('admLlave').value;
    $('admLlave').value = '';
    $('admEntrar').disabled = true;
    mensajeAdmin('Verificando…', true);
    enviar({ accion: 'entrarAdmin', llave: llave });
  }

  function pintarLista() {
    const q = sinAcentos($('admBuscar').value.trim());
    const cont = $('admFilas');
    cont.textContent = '';
    const visibles = empleados.filter((e) => !q || sinAcentos(e.nombre).includes(q) || sinAcentos(e.numero).includes(q));
    if (!visibles.length) {
      const vacio = document.createElement('div');
      vacio.className = 'fila';
      vacio.textContent = empleados.length ? 'Sin resultados' : 'No hay empleados activos';
      cont.appendChild(vacio);
      return;
    }
    for (const e of visibles) {
      const fila = document.createElement('div');
      fila.className = 'fila';
      const num = document.createElement('span'); num.className = 'num'; num.textContent = e.numero;
      const nom = document.createElement('span'); nom.textContent = e.nombre;
      const dedos = document.createElement('span');
      if (!e.dedos.length) {
        const c = document.createElement('span'); c.className = 'chip falta'; c.textContent = 'Sin huella';
        dedos.appendChild(c);
      } else {
        for (const d of e.dedos) {
          const c = document.createElement('span'); c.className = 'chip'; c.textContent = NOMBRES_DEDO[d - 1] || ('Dedo ' + d);
          dedos.appendChild(c);
        }
      }
      fila.append(num, nom, dedos);
      cont.appendChild(fila);
    }
  }

  $('admEntrar').addEventListener('click', entrarAdmin);
  $('admLlave').addEventListener('keydown', (e) => { if (e.key === 'Enter') entrarAdmin(); });
  $('admSalir').addEventListener('click', cerrarAdmin);
  $('admBuscar').addEventListener('input', pintarLista);

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'a') {
      e.preventDefault();
      if (!adminAbierto()) abrirAdmin();
    } else if (e.key === 'Escape' && adminAbierto()) {
      cerrarAdmin();
    }
  });

  // ---------- Mensajes que manda el programa (C#) ----------
  let temporizadorLectura;

  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.addEventListener('message', (e) => {
      const m = e.data;
      if (m.tipo === 'estado') {
        $('sucursal').textContent = m.sucursal;
        $('red').textContent = m.red;
        $('red').classList.toggle('sin-red', !m.enLinea);
        $('info').textContent = m.info;
        $('aviso').textContent = m.aviso || '';
      } else if (m.tipo === 'lector') {
        $('lector').textContent = m.texto;
        $('lector').classList.toggle('mal', !m.listo);
      } else if (m.tipo === 'dedo') {
        $('titulo').textContent = m.puesto ? 'Leyendo tu huella…' : 'Coloca tu dedo en el lector';
      } else if (m.tipo === 'lectura') {
        const l = $('lectura');
        l.textContent = m.texto;
        l.className = 's ' + (m.buena ? 'ok' : 'err');
        clearTimeout(temporizadorLectura);
        temporizadorLectura = setTimeout(() => { l.textContent = ''; l.className = 's'; }, 3000);
      } else if (m.tipo === 'admin') {
        if (!adminAbierto()) return;
        if (m.fase === 'error') {
          mensajeAdmin(m.texto);
          $('admEntrar').disabled = false;
          $('admLlave').focus();
        } else if (m.fase === 'lista') {
          empleados = m.empleados || [];
          mensajeAdmin('');
          $('admLogin').classList.add('oculto');
          $('admLista').classList.remove('oculto');
          pintarLista();
          $('admBuscar').focus();
        }
      }
    });
  }
</script>
</body>
</html>
